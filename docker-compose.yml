services:
  mysql:
    image: mysql:8.4
    container_name: realtime-trading-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: realtime_trading
      MYSQL_USER: trading
      MYSQL_PASSWORD: trading1234
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
