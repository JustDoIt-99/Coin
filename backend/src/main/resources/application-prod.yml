jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGIN}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: realtime-trading-backend

order:
  limit-index:
    enabled: ${ORDER_LIMIT_INDEX_ENABLED:true}

market:
  orderbook:
    max-age-seconds: ${MARKET_ORDERBOOK_MAX_AGE_SECONDS:2}
    rest-fallback-enabled: ${MARKET_ORDERBOOK_REST_FALLBACK_ENABLED:true}

logging:
  file:
    path: ${LOG_PATH:./logs}
